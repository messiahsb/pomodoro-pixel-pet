<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Pomodoro Pet</title>
	<link rel="stylesheet" href="styles/popup.css">
</head>
<body>

    <div class="title-wrapper">
        <h1 id="title">Pom Timer</h1>
    </div>
    
    <div class="session-panel">
        <button id="focus-button" class="control-button">Focus</button>
        <button id="short-button" class="control-button">Short Break</button>
        <button id="long-button" class="control-button">Long Break</button>
    </div>
    
    <p id="timer">25:00</p>
    
   <div class="control-button-panel"> 
    <button id="start-button" class="control-button">Start</button>
    <button id="reset-button" class="control-button">Reset</button>
   </div>

   <img id="pet-sprite" src="assets/pet-placeholder.png" alt="Your pet">
   
    <script src="scripts/popup.js"></script>
</body>
</html>
